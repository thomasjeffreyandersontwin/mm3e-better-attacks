<form class="measurement-calculator">
  <header class="sheet-header">
    <h1 class="title">Measurement Lookup & Calculator</h1>
  </header>

  <!-- Simple Lookup Section -->
  <div class="form-section">
    <h3>Simple Lookup</h3>
    <div class="form-row">
      <label for="rank-input">Rank:</label>
      <input type="number" id="rank-input" placeholder="Enter rank (-5 to 30+)">
      <label for="measurement-type">Type:</label>
      <select id="measurement-type">
        <option value="">Select Type</option>
        {{#each measurementTypes}}
        <option value="{{value}}">{{label}}</option>
        {{/each}}
      </select>
      <label>Result:</label>
      <div id="measurement-result" class="result-display"></div>
    </div>
  </div>

  <!-- Advanced Calculations Section -->
  <div class="form-section">
    <h3>Effect Value Calculator</h3>
    
    <!-- Distance Calculation -->
    <div class="calculation-row">
      <h4>Distance</h4>
      <div class="formula">
        <select id="time-lookup" class="formula-input">
          <option value="">Select Time</option>
          {{#each timeValues}}
          <option value="{{rank}}">{{value}}</option>
          {{/each}}
        </select>
        <span class="operator">+</span>
        <input type="number" id="speed-input" placeholder="Speed Rank" class="formula-input">
        <span class="equals">=</span>
        <div id="distance-result" class="result-display formula-result"></div>
      </div>
      <div class="formula-label">Distance Rank = Time Lookup + Speed Rank</div>
    </div>

    <!-- Time Calculation -->
    <div class="calculation-row">
      <h4>Time</h4>
      <div class="formula">
        <select id="distance-lookup" class="formula-input">
          <option value="">Select Distance</option>
          {{#each distanceValues}}
          <option value="{{rank}}">{{value}}</option>
          {{/each}}
        </select>
        <span class="operator">-</span>
        <input type="number" id="speed-input2" placeholder="Speed Rank" class="formula-input">
        <span class="equals">=</span>
        <div id="time-result" class="result-display formula-result"></div>
      </div>
      <div class="formula-label">Time Rank = Distance Lookup - Speed Rank</div>
    </div>

    <!-- Throwing Distance Calculation -->
    <div class="calculation-row">
      <h4>Throwing Distance</h4>
      <div class="formula">
        <input type="number" id="strength-input" placeholder="Strength Rank" class="formula-input">
        <span class="operator">-</span>
        <select id="mass-lookup" class="formula-input">
          <option value="">Select Mass</option>
          {{#each massValues}}
          <option value="{{rank}}">{{value}}</option>
          {{/each}}
        </select>
        <span class="equals">=</span>
        <div id="throwing-distance-result" class="result-display formula-result"></div>
      </div>
      <div class="formula-label">Throwing Distance Rank = Strength Rank - Mass Lookup</div>
    </div>
  </div>

  <!-- Reset Button -->
  <div class="form-group">
    <button type="button" id="reset-button" class="reset-btn">Reset All</button>
  </div>
</form>
